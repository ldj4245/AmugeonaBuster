services:
  - type: web
    name: amugeona-buster
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JDBC_DATABASE_URL
        sync: false
      - key: JDBC_DATABASE_USERNAME
        sync: false
      - key: JDBC_DATABASE_PASSWORD
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: WELPLUS_ID
        sync: false
      - key: WELPLUS_PW
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
