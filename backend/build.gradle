plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.amugeonabuster'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web & Real-time WebSockets
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Persistent Database (JPA)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // PostgreSQL Driver for Heroku Deployment
    runtimeOnly 'org.postgresql:postgresql'
    
    // H2 In-Memory Database for Local Development & Fast Testing
    runtimeOnly 'com.h2database:h2'

    // Lombok for clean boilerplate-free code
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing frameworks (JUnit 5 & Spring Boot Test)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ArchUnit for enforcing Hexagonal Architecture constraints
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

task buildFrontend(type: Exec) {
    workingDir '../frontend'
    inputs.dir '../frontend/src'
    inputs.dir '../frontend/public'
    inputs.files '../frontend/package.json', '../frontend/package-lock.json', '../frontend/index.html', '../frontend/vite.config.ts', '../frontend/tsconfig.json', '../frontend/tailwind.config.js', '../frontend/postcss.config.js'
    outputs.dir '../frontend/dist'

    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm ci && npm run test:games && npm run build'
    } else {
        commandLine 'sh', '-c', 'npm ci && npm run test:games && npm run build'
    }
}

task copyFrontendToStatic(type: Sync) {
    dependsOn buildFrontend
    from '../frontend/dist'
    exclude 'mockup.html'
    into 'src/main/resources/static'
}

processResources.dependsOn copyFrontendToStatic

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

bootRun {
    systemProperty 'file.encoding', 'UTF-8'
    jvmArgs = ["-Dfile.encoding=UTF-8"]
}
