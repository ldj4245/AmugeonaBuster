plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.0'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.amugeonabuster'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web & Real-time WebSockets
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Persistent Database (JPA)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    
    // PostgreSQL Driver for Heroku Deployment
    runtimeOnly 'org.postgresql:postgresql'
    
    // H2 In-Memory Database for Local Development & Fast Testing
    runtimeOnly 'com.h2database:h2'

    // Lombok for clean boilerplate-free code
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing frameworks (JUnit 5 & Spring Boot Test)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // ArchUnit for enforcing Hexagonal Architecture constraints
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.2.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
