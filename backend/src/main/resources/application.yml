server:
  port: 8080

spring:
  profiles:
    active: local

kakao:
  api:
    rest-key: ${KAKAO_REST_API_KEY:4d6379aaf33b3d3c003c6772ed718e7c}

---
# 💻 로컬 개발 환경 (H2 In-Memory DB)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:amugeonabuster;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

---
# 🚀 운영 및 Heroku 배포 환경 (PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Heroku가 자동으로 제공하는 DB JDBC URL 바인딩
    url: ${JDBC_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
