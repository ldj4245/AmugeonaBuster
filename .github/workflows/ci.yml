name: 검사 및 배포
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew build --no-daemon

  sync-to-huggingface:
    name: Hugging Face Spaces 자동 배포
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hugging Face Spaces 동기화
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ]; then
            git push "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" main:main --force
            echo "Hugging Face Space ($HF_SPACE) 동기화 완료"
          else
            echo "HF_TOKEN 또는 HF_SPACE Secret이 설정되지 않아 동기화를 건너뜁니다."
          fi
